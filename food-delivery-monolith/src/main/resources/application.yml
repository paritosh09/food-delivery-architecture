server:
  port: 8080

spring:
  application:
    name: food-delivery-monolith
  
  datasource:
    url: jdbc:postgresql://localhost:5432/food_delivery
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    com.fooddelivery: DEBUG
    org.springframework.web: INFO
